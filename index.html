<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Risk Control Console</title>
<meta name="theme-color" content="#08090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Risk Console">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel-2:#EFECE5; --line:rgba(8,9,11,.10); --line-2:rgba(8,9,11,.18);
  --text:#101114; --muted:rgba(16,17,20,.64); --faint:rgba(16,17,20,.46);
  --gold:#8A6A2F; --gold-fill:#D4AF6A; --gold-hi:#C49B4E; --on-gold:#08090B; --gold-tint:rgba(198,161,91,.16);
  --pos:#0B8474; --neg:#B93A2E; --pos-tint:rgba(11,132,116,.10); --neg-tint:rgba(185,58,46,.09);
  --input:#FFFFFF; --hover:rgba(8,9,11,.05); --shadow:0 1px 2px rgba(8,9,11,.06);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08090B; --panel:#0E0F12; --panel-2:#15171B; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
    --text:rgba(255,255,255,.88); --muted:rgba(255,255,255,.58); --faint:rgba(255,255,255,.40);
    --gold:#D4AF6A; --gold-fill:#D4AF6A; --gold-hi:#E4C988; --on-gold:#08090B; --gold-tint:rgba(198,161,91,.15);
    --pos:#2DD4BF; --neg:#F07167; --pos-tint:rgba(45,212,191,.09); --neg-tint:rgba(240,113,103,.10);
    --input:rgba(255,255,255,.04); --hover:rgba(255,255,255,.05); --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08090B; --panel:#0E0F12; --panel-2:#15171B; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.88); --muted:rgba(255,255,255,.58); --faint:rgba(255,255,255,.40);
  --gold:#D4AF6A; --gold-fill:#D4AF6A; --gold-hi:#E4C988; --on-gold:#08090B; --gold-tint:rgba(198,161,91,.15);
  --pos:#2DD4BF; --neg:#F07167; --pos-tint:rgba(45,212,191,.09); --neg-tint:rgba(240,113,103,.10);
  --input:rgba(255,255,255,.04); --hover:rgba(255,255,255,.05); --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:1480px;margin:0 auto;padding:0 24px 64px}
@media (max-width:640px){.app{padding:0 16px 48px}}
a{color:var(--gold)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:4px}

/* top bar + nav */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(20px + env(safe-area-inset-top)) 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold-hi),var(--gold-fill));flex:none;position:relative}
.mark::after{content:"";position:absolute;inset:9px;border:2px solid var(--on-gold);border-radius:3px;opacity:.85}
.brand-name{font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.backup-age{font-size:11px;color:var(--faint)}
.sync{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok::before{background:var(--pos)} .sync.err::before{background:var(--neg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:24px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.is-active{color:var(--text);border-bottom-color:var(--gold-fill)}

/* shared surfaces */
.view{display:none} .view.is-active{display:block}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
@media (max-width:640px){.card{padding:16px}}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:6px;max-width:760px}
.banner{border:1px solid color-mix(in srgb,var(--gold-fill) 40%,transparent);background:var(--gold-tint);border-radius:12px;padding:12px 16px;font-size:13px}
.banner strong{color:var(--gold)}
.note{font-size:13px;color:var(--muted)}

/* controls */
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label.f>span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
input,select,textarea{font:14px var(--sans);color:var(--text);background:var(--input);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=number]{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--gold-fill) 55%,transparent);outline-offset:0;border-color:var(--gold-fill)}
input[readonly]{background:var(--panel-2);color:var(--muted)}
input:disabled{opacity:.55}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{font-family:var(--sans);color:var(--faint)}
@media (max-width:480px){.brand-sub{display:none}}
.btn{appearance:none;font:600 13px var(--sans);border-radius:8px;padding:8px 14px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--gold-fill)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.btn.primary:hover:not(:disabled){background:var(--gold-hi)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger:hover:not(:disabled){border-color:var(--neg);color:var(--neg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--neg);font-size:13px}

/* account form */
.acct-form{display:flex;flex-direction:column;gap:14px}
.count{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.count>span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);width:100%}
.seg{display:flex;gap:6px}
.seg .btn.on{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.count label.f{width:110px}

/* roster */
.roster-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.roster-head p{color:var(--muted);margin-top:4px;max-width:560px}
.bankroll{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.bankroll .row{align-items:flex-end}
.bankroll label.f{width:130px}
.bankroll .cap{font-size:12px;color:var(--muted);max-width:460px;text-align:right}
@media (max-width:720px){.bankroll{align-items:stretch}.bankroll .cap{text-align:left}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:18px 0 12px}
.toolbar label.f{width:auto;min-width:150px}
.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto;padding-bottom:8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.pos td{background:var(--pos-tint)} tr.neg td{background:var(--neg-tint)}
tr.drop-over td{box-shadow:inset 0 2px 0 var(--gold-fill)}
tr.dragging{opacity:.45}
td.click{cursor:pointer;border-radius:0} td.click:hover,span.click:hover{background:var(--hover)}
span.click{cursor:pointer;border-radius:5px;padding:2px 4px;margin:-2px -4px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.plan{white-space:normal;font-style:italic;color:var(--gold);min-width:260px}
td.notes{max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.empty{text-align:center;color:var(--muted);padding:28px}
.tick{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line-2);background:transparent;color:var(--on-gold);font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.tick.on{background:var(--pos);border-color:var(--pos);color:#06201c}
.tick:disabled{opacity:.5}
input.pnl{width:92px;padding:5px 8px;font-family:var(--mono);font-size:13px}
input.cell{padding:4px 6px;font-size:13px;width:130px}
/* Account roster: same font as Firm/Type, even-width digits, bold account # and balance */
[data-slot="tbody"] td.num,[data-slot="tbody"] .mono,[data-slot="tbody"] input.cell{font-family:var(--sans);font-variant-numeric:tabular-nums}
[data-slot="tbody"] td[data-edit="currentBalance"],[data-slot="tbody"] span[data-edit="accountNumber"]{font-weight:600}
.cellflex{display:flex;align-items:center;gap:8px}
.handle{cursor:grab;color:var(--faint);user-select:none;font-size:15px;line-height:1}
.arrows{display:flex;flex-direction:column}
.arrows button{appearance:none;border:0;background:none;color:var(--faint);font-size:10px;line-height:1;padding:1px 3px;cursor:pointer}
.arrows button:hover:not(:disabled){color:var(--gold)}
.arrows button:disabled{opacity:.25;cursor:default}
.foot{display:flex;flex-direction:column;gap:4px;margin-top:14px;font-size:12px;color:var(--muted)}
details.approach{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel-2)}
details.approach+details.approach{margin-top:10px}
details.approach summary{cursor:pointer;font-weight:600}
details.approach ul{margin:10px 0 2px;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.status{display:flex;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.pill.gold{background:var(--gold-tint);color:var(--gold)}
.pill.pos{background:var(--pos-tint);color:var(--pos)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.metric .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.metric .v{font:600 22px var(--mono);margin-top:4px;letter-spacing:-.02em}
.metric .h{font-size:12px;color:var(--muted);margin-top:2px}
.metric.accent{border-color:color-mix(in srgb,var(--gold-fill) 45%,transparent);background:var(--gold-tint)}
.metric.accent .v{color:var(--gold)}
.metric.good .v{color:var(--pos)} .metric.bad .v{color:var(--neg)} .metric.warn .v{color:var(--gold)}
.up{color:var(--neg)} .down{color:var(--pos)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line-2);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font:500 12px var(--sans);cursor:pointer}
.chip.is-active{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:140px 1fr auto;gap:12px;align-items:center;font-size:13px}
.bar .track{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar .fill{height:100%;background:var(--gold-fill);border-radius:99px}
@media (max-width:560px){.bar{grid-template-columns:100px 1fr}.bar .amt{grid-column:1/-1}}
.months{display:flex;gap:8px;align-items:flex-end;height:160px;overflow-x:auto;padding-top:18px}
.month{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:46px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.month .col{width:26px;background:var(--gold-fill);border-radius:5px 5px 2px 2px;min-height:2px}
input.cnt{width:70px;padding:4px 6px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}

/* variance */
.days{display:flex;gap:6px}
.day{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2)}
.day.is-done{background:var(--pos);border-color:var(--pos)}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.act{appearance:none;text-align:left;border:1px solid var(--line-2);background:var(--panel-2);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;gap:2px;font:inherit}
.act:hover:not(:disabled){border-color:var(--gold-fill)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .a1{font-weight:600} .act .a2{font-size:12px;color:var(--muted)}
.act.primary{background:var(--gold-tint);border-color:color-mix(in srgb,var(--gold-fill) 50%,transparent)}
.chart{position:relative;height:170px}
.chart svg{width:100%;height:160px;display:block}
.chart .zero{stroke:var(--line-2);stroke-dasharray:4 4}
.chart .line{fill:none;stroke:var(--pos);stroke-width:2;vector-effect:non-scaling-stroke}
.chart .line.is-down{stroke:var(--neg)}
.chart .lab{position:absolute;right:0;font:11px var(--mono);color:var(--faint)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel-2)}
.tag.win,.tag.eval_pass,.tag.payout{background:var(--pos-tint);color:var(--pos)}
.tag.loss,.tag.eval_fail,.tag.blown{background:var(--neg-tint);color:var(--neg)}

/* calculator */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.result{font:600 18px var(--mono);margin-top:14px;color:var(--gold)}
.triad{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:end;max-width:560px}
.triad .op{padding-bottom:9px;color:var(--faint);font-weight:600}
ul.plain{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.plain li{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:13px}
ul.plain li strong,ul.plain li .r{font-family:var(--mono)}

/* prop firm cards */
.firms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.firm dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:14px 0}
.firm dt{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.firm dd{margin:2px 0 0;font-family:var(--mono);font-size:13px}
.firm .code{color:var(--gold);font-weight:600}

/* modal + toast */
#modal.open{position:fixed;inset:0;z-index:50}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:20px;max-width:420px;width:100%}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:480px}
.toast{background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--gold-fill);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>
      <div><div class="brand-name">Risk Control Console</div><div class="brand-sub">Private trading operations</div></div>
    </div>
    <div class="top-right">
      <div class="sync" id="sync">Loading…</div>
      <button type="button" class="btn sm" id="bk-export" title="Save every account, backtest, cost, payout and setting to one file">Export backup</button>
      <button type="button" class="btn sm" id="bk-import" title="Replace everything here with a backup file">Import backup</button>
      <input type="file" id="bk-file" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="spend">Spend</button>
    <button class="tab" data-tab="backtesting">Backtesting</button>
    <button class="tab" data-tab="variance">Variance</button>
    <button class="tab" data-tab="calculator">Calculator</button>
    <button class="tab" data-tab="prop-firms">Recommended prop firms</button>
  </nav>
  <main>
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-spend"></section>
    <section class="view" id="view-backtesting"></section>
    <section class="view" id="view-variance"></section>
    <section class="view" id="view-calculator"></section>
    <section class="view" id="view-prop-firms"></section>
  </main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============================================================
   Rules data (read off the original site's server, 94 bands)

const SIZE_TOKEN = /^\d+k$|^\d+$/;
const CATS = ['eval_fee', 'reset', 'activation', 'subscription', 'data_feed', 'platform', 'payout_fee', 'other'];
const CAT_LABEL = {eval_fee: 'Evaluation fee', reset: 'Reset', activation: 'Activation fee', subscription: 'Subscription', data_feed: 'Data feed', platform: 'Platform', payout_fee: 'Payout fee', other: 'Other'};
const catLabel = e => CAT_LABEL[e] ?? e.replace(/_/g, ' ');
const r2 = e => Math.round(100 * e) / 100;
const normFirm = e => e ? e.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(e => e.length > 0 && !SIZE_TOKEN.test(e)).sort().join(' ') : '';
const UNASSIGNED_FIRM = 'Unassigned';
const dayMs = e => Date.parse(`${e.slice(0, 10)}T00:00:00.000Z`);
const daysBetween = (e, t) => Math.round((dayMs(t) - dayMs(e)) / 864e5);

const pct = (e, t = 0) => e == null ? '—' : `${(100 * e).toFixed(t)}%`;
const monthLabel = e => { const [t, a] = e.split('-'); return `${new Date(Date.UTC(Number(t), Number(a) - 1, 1)).toLocaleString('en-US', {month: 'short', timeZone: 'UTC'})} ${t.slice(2)}`; };

function passRateInfo(e){
  const t = Math.max(0, Math.trunc(e.passed || 0)), a = Math.max(0, Math.trunc(e.failed || 0)), s = t + a, n = Math.max(0, Math.max(0, Math.trunc(e.evalsBought ?? 0)) - s);

    insufficientData: s === 0 ? (n > 0 ? `no eval has been decided yet — ${n} still open, so there is no pass rate to give` : 'no evals have been decided yet, so there is no pass rate to give') : `only ${s} decided eval${s === 1 ? '' : 's'}, 10 needed before a pass rate means anything`}

const rateFields = e => ({passRate: e.rate, decidedEvals: e.decidedCount, undecidedEvals: e.undecidedCount, passRateNote: e.insufficientData});

  const a = Math.max(0, Math.floor(t.passed)), s = Math.max(0, Math.floor(t.failed));

}
function baseAnalytics(entries, outcomes, today){
  const s = entries.reduce((e, t) => e + t.amount, 0), r = outcomes.reduce((e, t) => e + t.paidOut, 0);
  let l = 0, i = 0, c = null;
  for (const t of entries) { if (t.category === 'eval_fee') l += qtyOf(t); if (t.category === 'reset') i += qtyOf(t); if (!c || t.date < c) c = t.date; }
  const map = new Map(), mk = e => ({firm: e, spent: 0, evals: 0, resets: 0, passed: 0, failed: 0, active: 0, paidOut: 0});
  for (const t of entries) { const k = normFirm(t.firm), row = map.get(k) ?? mk(t.firm?.trim() || UNASSIGNED_FIRM); row.spent += t.amount; if (t.category === 'eval_fee') row.evals += qtyOf(t); if (t.category === 'reset') row.resets += qtyOf(t); map.set(k, row); }
  for (const t of outcomes) { const k = normFirm(t.firm), row = map.get(k) ?? mk(t.firm?.trim() || UNASSIGNED_FIRM); row.passed += t.passed; row.failed += t.failed; row.active += t.active; row.paidOut += t.paidOut; map.set(k, row); }

    return {firm: e.firm, spent: r2(e.spent), paidOut: r2(e.paidOut), net: r2(e.paidOut - e.spent), evals: t, resets: e.resets, passed: e.passed, failed: e.failed, active: e.active,
      passRate: a.rate, decidedEvals: a.decidedCount, undecidedEvals: a.undecidedCount, passRateNote: a.insufficientData,
      costPerEval: e.evals > 0 ? r2(e.spent / e.evals) : null, costPerPass: e.passed > 0 ? r2(e.spent / e.passed) : null};
  }).sort((a, b) => b.spent - a.spent);

  const j = passRateInfo({passed: f, failed: y, evalsBought: v}), g = r - s;
  const cat = new Map(); for (const t of entries) { const e = cat.get(t.category) ?? {amount: 0, count: 0}; e.amount += t.amount; e.count += 1; cat.set(t.category, e); }
  const mon = new Map(); for (const t of entries) { const k = t.date.slice(0, 7), e = mon.get(k) ?? {amount: 0, count: 0}; e.amount += t.amount; e.count += 1; mon.set(k, e); }

function withFirmOverrides(e, t){
  if (t.length === 0) return e;

  const rows = e.byFirm.map(e => { const o = a.get(normFirm(e.firm)); return o ? (s.add(normFirm(e.firm)), applyFirmOverride(e, o)) : e; });
  for (const o of t) { const k = normFirm(o.firm); if (!k || s.has(k)) continue;
    rows.push(applyFirmOverride({firm: o.firm.trim() || UNASSIGNED_FIRM, spent: 0, paidOut: 0, net: 0, evals: 0, resets: 0, passed: 0, failed: 0, active: 0, passRate: null, decidedEvals: 0, undecidedEvals: 0,

  root.addEventListener('click', e => {

    if (tr) trade(tr.dataset.trade); else if (act === 'buy') buyEval(); else if (act === 'payout') payout(); else if (act === 'reset') run = freshRun(); else return;
    persist(); render();
  });
  render();
  return {refresh: render};
}

/* ============================================================
   Calculators
   ============================================================ */
const CALC_FIRMS = [['Topstep 50K', 40], ['Lucid Flex 50K', 40], ['Tradeify Select', 40], ['MFF Rapid EOD 50K', 35], ['FundedSeat Standard Daily', 35], ['FundedNext 50K Flex', 40], ['Custom', 40]];
const CALC_COST = {'Topstep 50K': 49, 'Lucid Flex 50K': 84.5, 'Tradeify Select': 111, 'MFF Rapid EOD 50K': 77, 'FundedSeat Standard Daily': 79, 'FundedNext 50K Flex': 70};
function CalculatorPage(root){
  const v = {evAvg: 2000, evChance: 40, evCost: 49, evPass: 40, pts: 20, ctr: 1, usd: 100, simBank: 500, simFirm: 'Topstep 50K', simPass: 40, simChance: 40, simAvg: 2000, simCustom: 89,
    bFirm: 'Topstep 50K', bPass: 40, bBank: 500, bMax: 10};
  const LIM = {evAvg: [0], evChance: [0, 100], evCost: [0], evPass: [0, 100], pts: [0], ctr: [0], usd: [0], simBank: [0], simPass: [0, 100], simChance: [0, 100], simAvg: [0], simCustom: [0], bPass: [0, 100], bBank: [0], bMax: [1, 20]};
  const inp = (k, step) => `<input type="text" inputmode="decimal" data-k="${k}" value="${v[k]}" ${step ? 'data-step="1"' : ''}>`;
  const firmSel = (k, fmt) => `<select data-sel="${k}">${CALC_FIRMS.map(([n, p]) => `<option value="${esc(n)}" ${v[k] === n ? 'selected' : ''}>${esc(fmt(n, p))}</option>`).join('')}</select>`;
  root.innerHTML = `<div class="stack">
    <div class="page-head"><div><h1>Calculators</h1><p>EV, NQ points to dollars, risk of ruin, and bankroll sizing.</p></div></div>
    <div class="card"><h2>EV Calculator</h2><p class="note" style="margin:4px 0 14px">Expected value per eval: (pass rate × payout chance × avg payout) − eval cost.</p>
      <div class="calc-grid"><label class="f"><span>Average payout ($)</span>${inp('evAvg')}</label><label class="f"><span>Payout chance (%)</span>${inp('evChance')}</label>
        <label class="f"><span>Eval cost ($)</span>${inp('evCost')}</label><label class="f"><span>Eval pass rate (%)</span>${inp('evPass')}</label></div>
      <p class="result" data-out="ev"></p></div>
    <div class="card"><h2>NQ Points · Contracts · $</h2><p class="note" style="margin:4px 0 14px">$20 per point per contract. Enter any two; the third updates.</p>
      <div class="triad"><label class="f"><span>Points</span>${inp('pts')}</label><span class="op">×</span><label class="f"><span>Contracts</span>${inp('ctr', 1)}</label><span class="op">=</span><label class="f"><span>$</span>${inp('usd')}</label></div></div>
    <div class="card"><h2>Returns Simulator</h2><p class="note" style="margin:4px 0 14px">Simulate 1,000 eval attempts: pass rate, then payout chance and average payout if funded. See average return and sample outcomes.</p>
      <div class="calc-grid"><label class="f"><span>Bankroll / amount ($)</span>${inp('simBank')}</label>
        <label class="f"><span>Firm (eval cost)</span>${firmSel('simFirm', n => `${n} ($${CALC_COST[n] ?? v.simCustom})`)}</label>
        <label class="f" data-show="custom"><span>Eval cost ($)</span>${inp('simCustom')}</label>
        <label class="f"><span>Pass rate (%)</span>${inp('simPass')}</label><label class="f"><span>Payout chance (%)</span>${inp('simChance')}</label>
        <label class="f"><span>Average payout ($)</span>${inp('simAvg')}</label></div>
      <div style="margin-top:14px"><button type="button" class="btn primary" data-act="sim">Simulate returns</button></div>
      <div data-out="sim"></div></div>
    <div class="card"><h2>Eval Budget &amp; Pass Odds</h2><p class="note" style="margin:4px 0 14px"><strong>Budget + odds.</strong> How many evals you can afford, and your chance of passing 1, 2, 3… in a row (same pass rate each time).</p>
      <div class="calc-grid"><label class="f"><span>Prop firm challenge</span>${firmSel('bFirm', (n, p) => `${n} (${p}% pass)`)}</label>
        <label class="f"><span>Your pass rate (%)</span>${inp('bPass')}</label><label class="f"><span>Bankroll ($)</span>${inp('bBank')}</label><label class="f"><span>Show evals up to</span>${inp('bMax')}</label></div>
      <div data-out="budget" style="margin-top:14px"></div></div>
  </div>`;
  const setInput = (k, val) => { const el = $(`[data-k="${k}"]`, root); if (el && document.activeElement !== el) el.value = val; };
  function compute(){
    $('[data-out="ev"]', root).textContent = `EV per eval: $${(v.evPass / 100 * (v.evChance / 100) * v.evAvg - v.evCost).toFixed(2)}`;
    $('[data-show="custom"]', root).style.display = v.simFirm === 'Custom' ? '' : 'none';
    const M = v.bPass / 100, I = v.bFirm in CALC_COST && v.bBank > 0 ? Math.floor(v.bBank / CALC_COST[v.bFirm]) : null, B = Math.min(20, Math.max(1, v.bMax)), k = Math.max(1, I ?? B);
    const choose = (n, t) => { if (t < 0 || t > n) return 0; t = Math.min(t, n - t); let r = 1; for (let i = 0; i < t; i++) r = r * (n - i) / (i + 1); return r; };
    const D = Array.from({length: k + 1}, (_, t) => ({evals: t, pct: choose(k, t) * Math.pow(M, t) * Math.pow(1 - M, k - t) * 100}));
    const L = I != null && I > 0 ? (1 - Math.pow(1 - M, I)) * 100 : null;
    $('[data-out="budget"]', root).innerHTML = `${I != null && I > 0 ? `<p>With $${v.bBank.toLocaleString()} you can afford ~${I} eval${I !== 1 ? 's' : ''} at this firm.</p>${L != null ? `<p>Chance you pass at least one of those: <strong class="num">${L.toFixed(1)}%</strong></p>` : ''}` : ''}
      <p class="note" style="margin-top:6px">Chance of 0 (fail all) is the same as risk of ruin for evals.</p>
      <p style="margin-top:12px"><strong>In ${k} attempts: chance you pass exactly 0, 1, … ${k}</strong></p>
      <p class="note">Binomial: each row is P(exactly that many passes in ${k} tries). Adds to 100%.</p>
      <ul class="plain">${D.map(({evals: e, pct: n}) => `<li><span>${e === 0 ? 'Exactly 0 (fail all)' : `Exactly ${e}`}</span><strong>${n >= .01 ? n.toFixed(2) : n >= 1e-4 ? n.toFixed(4) : '<0.01'}%</strong></li>`).join('')}</ul>`;
  }
  root.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    const s = e.target.value; if (s === '' || s === '-') return;
    let n = e.target.dataset.step ? parseFloat(s) : parseInt(s, 10); if (Number.isNaN(n)) return;
    const [lo, hi] = LIM[k] || []; if (lo != null && n < lo) n = lo; if (hi != null && n > hi) n = hi;
    v[k] = n;
    if (k === 'pts') { v.usd = 20 * n * v.ctr; setInput('usd', v.usd); }
    if (k === 'ctr') { v.usd = 20 * v.pts * n; setInput('usd', v.usd); }
    if (k === 'usd' && v.pts > 0) { v.ctr = n / (20 * v.pts); setInput('ctr', v.ctr); }
    if (k === 'simPass') { v.simFirm = 'Custom'; $('[data-sel="simFirm"]', root).value = 'Custom'; }
    if (k === 'bPass') { v.bFirm = 'Custom'; $('[data-sel="bFirm"]', root).value = 'Custom'; }
    if (k === 'simCustom') { const o = $('[data-sel="simFirm"] option[value="Custom"]', root); if (o) o.textContent = `Custom ($${v.simCustom})`; }
    compute();
  });
  root.addEventListener('focusout', e => { const k = e.target.dataset.k; if (k) e.target.value = v[k]; });
  root.addEventListener('change', e => {
    const s = e.target.dataset.sel; if (!s) return;
    v[s] = e.target.value; const f = CALC_FIRMS.find(x => x[0] === v[s]);
    if (f && f[0] !== 'Custom') { if (s === 'simFirm') { v.simPass = f[1]; setInput('simPass', f[1]); } else { v.bPass = f[1]; setInput('bPass', f[1]); } }
    compute();
  });
  root.addEventListener('click', e => {
    if (!e.target.closest('[data-act="sim"]')) return;
    const et = v.simFirm in CALC_COST ? CALC_COST[v.simFirm] : v.simCustom, p = v.simPass / 100, c = v.simChance / 100, J = v.simAvg, out = []; let r = 0;
    for (let a = 0; a < 1e3; a++) {
      if (!(Math.random() < p)) { out.push({label: 'Eval failed', ret: -et}); r -= et; continue; }
      if (!(Math.random() < c)) { out.push({label: 'Eval passed, funded failed', ret: -et}); r -= et; continue; }
      r += -et + J; out.push({label: `Eval passed, funded passed, payout $${J.toLocaleString()}`, ret: -et + J});
    }
    const avg = r / 1e3, last = out.slice(-10).reverse();
    $('[data-out="sim"]', root).innerHTML = `<div style="margin-top:16px"><p class="result" style="margin-top:0">Average payout $${(v.simBank + avg).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0})} on your $${v.simBank.toLocaleString()} investment.</p>
      <p class="note">Plus $${J.toLocaleString()} of profit remaining in funded account.</p><p style="margin-top:10px"><strong>Last 10 outcomes:</strong></p>
      <ul class="plain">${last.map(o => `<li><span>${esc(o.label)}</span><span class="r ${o.ret >= 0 ? 'down' : 'up'}">${o.ret >= 0 ? '+' : ''}$${o.ret.toFixed(0)}</span></li>`).join('')}</ul></div>`;
  });
  compute();
  return {refresh(){}};
}

/* ============================================================
   Recommended prop firms
   ============================================================ */
const FIRM_CARDS = [
  ['Topstep 50K', 'Evaluation (no add-ons)', '$50,000', '$2,000', '$3,000', '5 contracts (eval) / 2 funded', '$49 + $149 activation', '40%', '$2,000', '40%', 'JJ', 'Eval is $49 with a $149 activation fee paid after passing. Follow the dashboard 2K/3K targets. EOD trailing drawdown.'],
  ['Lucid Flex 50K', 'Evaluation', '$50,000', '$2,000', '$3,000', '4 contracts', '$84.50', '40%', '$2,000', '33%', 'JJ', 'EOD trailing drawdown.'],
  ['Tradeify Select 50K', 'Evaluation', '$50,000', '$2,000', '$3,000', '4 contracts', '$111', '40%', '$2,000', '33%', 'JJ', 'EOD trailing drawdown.'],
  ['MFF Rapid EOD 50K', 'Evaluation', '$50,000', '$2,000', '$3,000', '2 contracts', '$77', '35%', '$1,000', '60%', 'JJ', 'Two contracts on every trade. Eval is −$1,000 / +$750 until $53,000. Funded is −$1,000 / +$3,000 until above $52,000, then −$1,000 / +$1,500. EOD trailing drawdown.'],
  ['FundedSeat Standard Daily', 'Evaluation', '$50,000', '$2,000', '$3,000', '2 contracts', '$79', '35%', '$1,500', '50%', 'JJ', 'Two contracts on every trade. Eval is −$1,000 / +$1,520 until $53,000. Funded matches MFF Rapid EOD: −$1,000 / +$3,000 until above $52,000, then −$1,000 / +$1,500.'],
];
function PropFirmsPage(root){
  const k = ['Eval type', 'Account size', 'Drawdown', 'Profit target', 'Contracts', 'Eval cost', 'Pass rate', 'Avg payout', 'Payout chance', 'Discount code'];
  root.innerHTML = `<div class="stack">
    <div class="page-head"><div><h1>Recommended prop firms</h1><p>The 50K accounts to start with: Topstep 50K or Lucid Flex 50K, then add Tradeify Select, MFF Rapid EOD, or FundedSeat Standard Daily. Pass rate, average payout and payout chance come from a year of trading these firms with the dashboard's risk numbers.</p></div></div>
    <div class="banner"><strong>Discount codes:</strong> use code <strong>JJ</strong> at checkout on every prop firm — except Alpha firms, where the code is <strong>JJSIMON</strong>.</div>
    <div class="firms">${FIRM_CARDS.map(c => `<div class="card firm"><h2>${esc(c[0])}</h2><dl>${k.map((l, i) => `<div><dt>${l}</dt><dd class="${i === 9 ? 'code' : ''}">${esc(c[i + 1])}</dd></div>`).join('')}</dl><p class="note">${esc(c[11])}</p></div>`).join('')}</div>
  </div>`;
  return {refresh(){}};
}

/* ============================================================
   App shell
   ============================================================ */
const PAGES = {};
function showTab(name){
  if (!PAGES[name]) name = 'dashboard';
  $$('.tab').forEach(t => t.classList.toggle('is-active', t.dataset.tab === name));
  $$('.view').forEach(v => v.classList.toggle('is-active', v.id === 'view-' + name));
  PAGES[name].refresh?.();
  LS.setRaw('rcc:tab', name);
}
function boot(){
  PAGES.dashboard = Manager($('#view-dashboard'), 'dashboard');
  PAGES.backtesting = Manager($('#view-backtesting'), 'backtesting');
  PAGES.spend = SpendPage($('#view-spend'));
  PAGES.variance = VariancePage($('#view-variance'));
  PAGES.calculator = CalculatorPage($('#view-calculator'));
  PAGES['prop-firms'] = PropFirmsPage($('#view-prop-firms'));
  $('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) { showTab(t.dataset.tab); window.scrollTo({top: 0}); } });
  showTab(LS.raw('rcc:tab') || 'dashboard');
  initStore();
  // refresh "traded today" state when the 6pm ET trading day rolls over
  let lastKey = dayKey(new Date());
  setInterval(() => { const k = dayKey(new Date()); if (k !== lastKey) { lastKey = k; PAGES.dashboard.refresh(); PAGES.backtesting.refresh(); } }, 60000);
}
boot();

/* ============================================================
   Backup — export / import everything as one JSON file
   ============================================================ */
const BACKUP_PREFS = k => /tradingsite:|^variance-lab-v2$|^rcc:tab$/.test(k);
function backupData(){
  const prefs = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (BACKUP_PREFS(k)) prefs[k] = localStorage.getItem(k); } } catch {}
  return {app: 'risk-control-console', version: 1, exportedAt: new Date().toISOString(), docs: clone(S), prefs};
}
async function saveFile(filename, data){
  let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch {}
  if (dl) { await dl.save({filename, data}); return; }
  const u = URL.createObjectURL(new Blob([data], {type: 'application/json'})), a = document.createElement('a');
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}
function showBackupAge(){
  const t = Number(LS.raw('rcc:lastBackup')), b = $('#bk-export');
  if (!b) return;
  const days = t > 0 ? Math.floor((Date.now() - t) / 864e5) : null;
  b.title = 'Save every account, backtest, cost, payout and setting to one file' + (days == null ? ' — no backup yet' : ` — last backup ${days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago'}`);
  b.classList.toggle('primary', days == null ? hasAnyData() : days >= 7);
}
const hasAnyData = () => S.accounts.items.length > 0 || S.backtest.items.length > 0 || S.spend.entries.length > 0 || S.spend.payouts.length > 0;
async function exportBackup(){
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  try { await saveFile(`risk-console-backup-${stamp}.json`, JSON.stringify(backupData(), null, 2)); LS.setRaw('rcc:lastBackup', String(Date.now())); showBackupAge(); toast('Backup saved.'); }
  catch (e) { if (e?.code !== 'declined') toast('Backup failed: ' + (e?.message || e?.code || 'error')); }
}
async function importBackup(file){
  let b;
  try { b = JSON.parse(await file.text()); } catch { toast('That file is not a valid backup.'); return; }
  if (b?.app !== 'risk-control-console' || !b.docs) { toast('That file is not a Risk Control Console backup.'); return; }
  const n = b.docs.accounts?.items?.length ?? 0, when = b.exportedAt ? new Date(b.exportedAt).toLocaleString() : 'unknown date';
  if (!await confirmBox(`Replace everything here with the backup from ${when} (${n} account${n === 1 ? '' : 's'})? Current data on this page will be overwritten.`, 'Replace')) return;
  for (const k of Object.keys(DOC_DEFAULTS)) { S[k] = {...clone(DOC_DEFAULTS[k]), ...(b.docs[k] || {})}; save(k); }
  try { for (const [k, v] of Object.entries(b.prefs || {})) if (BACKUP_PREFS(k) && typeof v === 'string') localStorage.setItem(k, v); } catch {}
  setSync('', 'Restoring…');
  for (let i = 0; i < 100 && Object.keys(DOC_DEFAULTS).some(k => store.writing[k] || store.dirty[k]); i++) await sleep(100);
  location.reload();
}
$('#bk-export').addEventListener('click', exportBackup);
$('#bk-import').addEventListener('click', () => $('#bk-file').click());
$('#bk-file').addEventListener('change', e => { const f = e.target.files?.[0]; e.target.value = ''; if (f) importBackup(f); });
showBackupAge();

/* Offline support when hosted (works with no internet after the first visit) */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
